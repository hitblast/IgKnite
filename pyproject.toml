[project]
name = "igknite"
version = "2025.2.24"
description = "Unified, swiss-grade moderation & music bot for Discord."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "async-timeout>=5.0.1",
    "disnake[speed,voice]>=2.10.1",
    "python-decouple>=3.8",
    "spotipy>=2.25.0",
    "yt-dlp>=2025.2.19",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
